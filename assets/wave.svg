<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 84" width="156" height="84" role="img" aria-label="Rosto sorrindo com a mão acenando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="face" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFEB8F"/>
      <stop offset="0.55" stop-color="#FFCB2E"/>
      <stop offset="1" stop-color="#F5A000"/>
    </radialGradient>
    <clipPath id="mouth">
      <path d="M24 49 C24 62 30 69 40 69 C50 69 56 62 56 49 C48 52.5 32 52.5 24 49 Z"/>
    </clipPath>
    <style>
      .bob  { animation: bob 2.4s ease-in-out infinite; }
      .wave { transform-origin: 110px 72px; transform-box: view-box; animation: wave 2.4s ease-in-out infinite; }
      .arc  { animation: arc 2.4s ease-in-out infinite; }
      @keyframes wave {
        0%   { transform: rotate(0deg); }
        10%  { transform: rotate(16deg); }
        20%  { transform: rotate(-8deg); }
        30%  { transform: rotate(16deg); }
        40%  { transform: rotate(-4deg); }
        50%  { transform: rotate(12deg); }
        60%, 100% { transform: rotate(0deg); }
      }
      @keyframes bob {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-2px); }
      }
      @keyframes arc {
        0%, 60%, 100% { opacity: 0; }
        12%, 48% { opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bob, .wave, .arc { animation: none; }
        .arc { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- ROSTO 😄 -->
  <g class="bob">
    <circle cx="40" cy="44" r="32" fill="url(#face)" stroke="#E29500" stroke-width="1.5"/>
    <ellipse cx="28" cy="22" rx="12" ry="6" fill="#fff" opacity="0.28" transform="rotate(-25 28 22)"/>

    <ellipse cx="17" cy="49" rx="5.5" ry="3.5" fill="#FF6F3C" opacity="0.35"/>
    <ellipse cx="63" cy="49" rx="5.5" ry="3.5" fill="#FF6F3C" opacity="0.35"/>

    <path d="M25 39 Q30.5 30 36 39" fill="none" stroke="#6B3A00" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M44 39 Q49.5 30 55 39" fill="none" stroke="#6B3A00" stroke-width="3.6" stroke-linecap="round"/>

    <path d="M24 49 C24 62 30 69 40 69 C50 69 56 62 56 49 C48 52.5 32 52.5 24 49 Z" fill="#6B2E00"/>
    <g clip-path="url(#mouth)">
      <path d="M22 46 H58 V54.5 Q40 59 22 54.5 Z" fill="#fff"/>
      <ellipse cx="40" cy="70" rx="10.5" ry="7.5" fill="#FF7A7A"/>
    </g>
    <path d="M24 49 C24 62 30 69 40 69 C50 69 56 62 56 49 C48 52.5 32 52.5 24 49 Z" fill="none" stroke="#6B2E00" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="#FFB300" stroke-width="2.6" stroke-linecap="round">
    <path class="arc" d="M143 30 Q148 38 143 46"/>
    <path class="arc" d="M148 24 Q155 38 148 52" style="animation-delay:0.08s"/>
  </g>

  <g class="wave">
    <g transform="translate(110 72)" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-16.2" y="-27.2" width="32.4" height="30.4" rx="12" fill="#E29500"/>

      <line x1="-10" y1="-8" x2="-25" y2="-24" stroke="#E29500" stroke-width="9.5"/>
      <line x1="-10" y1="-8" x2="-25" y2="-24" stroke="#FFCB2E" stroke-width="7.5"/>

      <line x1="11" y1="-14" x2="16.5" y2="-39" stroke="#E29500" stroke-width="9"/>
      <line x1="11" y1="-14" x2="16.5" y2="-39" stroke="#FFCB2E" stroke-width="7"/>

      <line x1="3.7" y1="-14" x2="6.5" y2="-49" stroke="#E29500" stroke-width="9"/>
      <line x1="3.7" y1="-14" x2="6.5" y2="-49" stroke="#FFCB2E" stroke-width="7"/>

      <line x1="-3.7" y1="-14" x2="-5.5" y2="-52" stroke="#E29500" stroke-width="9"/>
      <line x1="-3.7" y1="-14" x2="-5.5" y2="-52" stroke="#FFCB2E" stroke-width="7"/>

      <line x1="-11" y1="-14" x2="-15.5" y2="-46" stroke="#E29500" stroke-width="9"/>
      <line x1="-11" y1="-14" x2="-15.5" y2="-46" stroke="#FFCB2E" stroke-width="7"/>

      <rect x="-15" y="-26" width="30" height="28" rx="11" fill="#FFCB2E" stroke="none"/>
      <ellipse cx="-5" cy="-12" rx="7" ry="10" fill="#fff" opacity="0.22"/>
    </g>
  </g>
</svg>
